[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-timeline-synthesizer"
version = "1.1.0"
description = "Scope-aware temporal and authority arbitration for provenance-backed multi-document synthesis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "CHAOCHUN CHUANG", email = "gemini960114@gmail.com" },
]
dependencies = [
  "docling-skill @ git+https://github.com/realraelrr/docling-skill.git@v1.2.1",
]

[project.scripts]
doc-timeline-synthesizer = "scripts.synthesize:main"

[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.exclude-package-data]
scripts = ["batch_convert.py"]
